<!DOCTYPE html>
<html lang="en" x-data="app()" :class="{ 'dark': darkMode }">

<head>

    <meta charset="UTF-8">
    <title>AI Knowledge Assistant</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link rel="stylesheet" href="styles.css">
    <!-- Removed github-markdown-css to avoid nested bubble styling conflicts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-[Inter]">

    <div class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->

        <div class="w-64 bg-white/70 dark:bg-slate-800/80 backdrop-blur border-r border-slate-200 dark:border-slate-700 flex flex-col">

            <div class="p-5 text-lg font-semibold flex items-center gap-2">
                🤖 AI Assistant
            </div>
                <!-- INGESTION JOBS -->
                <div class="mt-3 space-y-2">
                    <template x-for="job in ingestionJobs" :key="job.jobId">
                        <div class="p-2 bg-white/30 rounded">
                            <div class="text-sm font-medium" x-text="job.fileName"></div>
                            <div class="text-xs text-gray-500" x-text="job.state"></div>
                            <div class="w-full bg-gray-200 rounded-full h-2 mt-2 overflow-hidden">
                                <div class="bg-indigo-500 h-2 rounded-full"
                                     :style="'width:' + ((job.totalBatches>0)? (Math.round((job.completedBatches/job.totalBatches)*100)) : 0) + '%'">
                                </div>
                            </div>
                        </div>
                    </template>
                </div>


            <!-- MODE -->

            <div class="px-4">

                <select x-model="mode"
                        class="w-full bg-slate-100 dark:bg-slate-700 p-2 rounded-lg">

                    <option value="rag">Document AI</option>
                    <option value="general">General AI</option>

                </select>

            </div>

            <!-- UPLOAD -->

            <div class="p-4">

                <div class="upload-card"
                     @click="$refs.fileInput.click()"
                     @dragover.prevent
                     @drop.prevent="handleDrop">

                    <p class="text-sm text-center">Drag & Drop PDF</p>
                    <p class="text-xs text-center text-gray-400">or click to upload</p>

                    <input type="file"
                           x-ref="fileInput"
                           class="hidden"
                           @change="uploadFile">

                </div>

                <!-- UPLOAD STATUS -->

                <div x-show="uploading" class="mt-3">

                    <div class="text-xs text-indigo-500 mb-1" x-text="uploadMessage"></div>

                    <div class="w-full bg-gray-200 rounded-full h-2 dark:bg-gray-700">

                        <div class="bg-indigo-500 h-2 rounded-full transition-all duration-500"
                             :style="'width:' + uploadProgress + '%'"></div>

                    </div>

                </div>

            </div>

            <!-- DOCUMENTS -->

            <div class="px-4 flex-1 overflow-y-auto">

                <h3 class="text-xs uppercase text-gray-400 mb-2">
                    Documents
                </h3>

                <div class="text-xs text-gray-400 mb-3">
                    Click a document to query only that file
                </div>

                <template x-for="doc in documents">

                    <div class="doc-item flex justify-between items-center"
                         :class="selectedDoc === doc ? 'bg-indigo-500 text-white' : ''"
                         @click="selectDocument(doc)">

                        <span x-text="doc"></span>

                        <span x-show="selectedDoc === doc">
                            ✔
                        </span>

                        <button @click.stop="deleteDocument(doc)"
                                class="text-red-400 hover:text-red-600 text-xs ml-2">
                            🗑
                        </button>

                    </div>

                </template>

                <div x-show="documents.length === 0"
                     class="text-xs text-gray-400">

                    No documents uploaded

                </div>

            </div>

        </div>

        <!-- MAIN -->

        <div class="flex flex-col flex-1">

            <!-- HEADER -->

            <div class="flex justify-between items-center px-6 py-3 border-b border-slate-200 dark:border-slate-700">

                <div class="flex items-center gap-3">

                    <h2 class="font-semibold text-lg">
                        AI Knowledge Assistant
                    </h2>

                    <div class="text-xs text-green-500 flex items-center gap-1">
                        ● AI Online
                    </div>

                </div>

                <div class="flex items-center gap-4">

                    <button @click="toggleTheme" class="theme-btn">
                        🌙
                    </button>

                </div>

            </div>

            <!-- CHAT -->

            <div id="chatContainer" class="flex-1 overflow-y-auto p-6 space-y-6">

                <template x-for="(msg, index) in messages" :key="index">

                    <div :class="msg.role==='user' ? 'text-right message-row':''">

                        <div :class="msg.role==='user' ? 'user-bubble' : 'ai-bubble'">

                            <!-- MESSAGE -->
                            <div class="message-body">
                                <div class="markdown-body prose" x-html="renderMessage(msg.content)"></div>

                                <div class="msg-meta mt-2 flex items-center gap-2">
                                    <template x-if="msg.timestamp">
                                        <span class="text-xs text-gray-400" x-text="(new Date(msg.timestamp)).toLocaleTimeString()"></span>
                                    </template>

                                    <template x-if="msg.sources && msg.sources.length > 0">
                                        <div class="flex gap-2">
                                            <template x-for="s in msg.sources">
                                                <span class="source-badge" @click="selectDocument(s)" x-text="s"></span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>

                        </div>

                    </div>

                </template>

            </div>

            
            <!-- INPUT -->

            <div class="p-4 border-t border-slate-200 dark:border-slate-700 bg-white/60 dark:bg-slate-800/60 backdrop-blur">

                <div class="flex gap-3">

                    <input x-model="question"
                           @keydown.enter="sendMessage()"
                           placeholder="Ask something about your documents..."
                           class="chat-input flex-1">

                    <button x-show="!thinking" @click="sendMessage()"
                            class="send-btn">
                        <!--<button @click="sendMessage"
        class="send-btn">-->
                        Send

                    </button>

                    <button x-show="thinking"
                            @click="stopStreaming()"
                            class="px-4 py-2 bg-red-500 text-white rounded-lg">
                        Stop
                    </button>

                    <button @click="clearChat()" class="text-sm px-3 py-1 bg-gray-200 rounded">
                        Clear Chat
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
